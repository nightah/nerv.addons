# Kodi 20 (Nexus) ships Python 3.8.
target-version = "py38"
line-length = 120

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]

[lint.per-file-ignores]
# The smoke tests put the addon and its shims on sys.path before importing them.
"plugin.video.kayo/tests/*" = ["E402"]
"plugin.video.tennistv/tests/*" = ["E402"]
# Vendored from Project Nayuki; its long docstrings and tables are kept as upstream wrote them.
"plugin.video.*/resources/lib/qrcodegen.py" = ["E501", "RUF012"]
